      parameters:
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
        style: simple
      - explode: false
        in: path
        name: requester
        required: true
        schema:
          title: Requester
          type: string
        style: simple
      - explode: false
        in: path
        name: build_variant_name
        required: true
        schema:
          title: Build Variant Name
          type: string
        style: simple
      - explode: false
        in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
        style: simple
      - explode: false
        in: path
        name: task_name
        required: true
        schema:
          title: Task Name
          type: string
        style: simple
