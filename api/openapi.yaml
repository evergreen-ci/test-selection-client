openapi: 3.1.0
info:
  description: "Test Selection services, owner: DevProd Services & Integrations team"
  title: Test Selection Services
  version: 1.0.0
servers:
- url: /
paths:
  /api/test_selection/select_tests/:
    post:
      description: |-
        Get the results of the default strategy.
        :param project_id: The project id.
        :param requester: The requester.
        :param build_variant_name: The build variant name.
        :param task_id: The task id.
        :param task_name: The task name.
        :param test_names: The test names.
        :param background_tasks: Background tasks to run after the request is completed.
        :param strategies: The set of strategies to use
        :return: A set of strings representing the names of tests
                 that should run for the specified task based on the selected strategies.
      operationId: select_tests_with_data_in_body_api_test_selection_select_tests__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Body_select_tests_with_data_in_body_api_test_selection_select_tests__post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  description: Optional project filter
                  nullable: true
                  type: string
                title: Response Select Tests With Data In Body Api Test Selection
                  Select Tests  Post
                type: array
                uniqueItems: true
                default: null
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Select Tests With Data In Body
      tags:
      - test_selection
